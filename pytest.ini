[pytest]
testpaths = tests
addopts = -p no:cacheprovider -m "not live and not smoke"
markers =
    live: real Telegram/Todoist with test tokens (opt-in: -m live)
    smoke: container and script checks (serial: -p no:xdist -m smoke)
filterwarnings =
    ignore::DeprecationWarning:fastapi.testclient
    ignore:Using `httpx` with `starlette.testclient`

name: gateway

services:
  # Docker has no podman :U volume option: start scripts run this once to chown the volume root.
  volume-init:
    image: docker.io/library/python:3.14-slim-trixie@sha256:89fb7d3da20043c370643435258bdd7ab755d326d359001d02988ed15ae5219e
    profiles: ["setup"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    command: ["chown", "10001:10001", "/data"]
    volumes:
      - data:/data

  gateway:
    build:
      context: .
      dockerfile: Containerfile
      target: prod
    image: localhost/gateway:prod
    container_name: gateway
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /run/gateway
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: .env
    environment:
      ENV: production
      DATABASE_PATH: /data/gateway.sqlite3
      # Only Caddy reaches the backend; trust its forwarding headers from this network only.
      TRUSTED_PROXY_IPS: 10.89.47.0/24
    networks: [gateway-net]
    volumes:
      - data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -m app.healthcheck"]
      interval: 10s
      timeout: 4s
      start_period: 10s
      retries: 3
    stop_grace_period: 10s

  caddy:
    image: docker.io/library/caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    container_name: gateway-caddy
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      API_PREFIX: ${API_PREFIX}
      ADMIN_PREFIX: ${ADMIN_PREFIX}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-38080}:8080"
    networks: [gateway-net]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
    depends_on:
      - gateway
    restart: unless-stopped
    stop_grace_period: 10s

networks:
  gateway-net:
    name: gateway-net
    ipam:
      config:
        - subnet: 10.89.47.0/24

volumes:
  data:
    name: gateway-data
